{% extends 'base.html' %}
{% block content %}
<style>
    .profile-container {
        text-align: center;
        margin-top: 2rem;
    }

    .profile-img {
        display: block;
        margin: 0 auto;
        width: 180px;          /* You can adjust size here */
        height: 180px;
        object-fit: cover;     /* Ensures the image doesn't stretch */
        border-radius: 50%;    /* Makes the image perfectly circular */
        border: 3px solid #ddd;
    }

    .social-buttons {
        display: flex;
        justify-content: center;
        gap: 1rem;
        margin-top: 1.5rem;
    }

    .circle-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 45px;
        height: 45px;
        border-radius: 50%;
        color: white;
        font-weight: bold;
        text-decoration: none;
        font-size: 1.1rem;
    }

    .github { background-color: #333; }
    .linkedin { background-color: #0077b5; }
    .email { background-color: #dd4b39; }

    h1 {
        text-align: center;
        margin-bottom: 1rem;
    }
</style>

<div class="profile-container">
    <h1>Aditi Patil</h1>
    <img src="{{ url_for('static', filename='images/aditi_headshot.JPG') }}" alt="Aditi Patil" class="profile-img">
    <div class="social-buttons">
        <a href="https://github.com/adpat0324" class="circle-button github">G</a>
        <a href="https://www.linkedin.com/in/aditiapatil/" class="circle-button linkedin">in</a>
        <a href="mailto:aditi.patil0324@gmail.com" class="circle-button email">@</a>
    </div>
</div>
{% endblock %}
